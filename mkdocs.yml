site_name: MkDocs for Mere Mortals
site_description: Turning a folder of Markdown files into a finished documentation website. Installing MkDocs, writing pages, the configuration file explained line by line, navigation, the Material theme, Markdown extensions and plugins, and publishing to GitHub Pages.
site_url: https://paulsullivan33-dev.github.io/mkdocs-for-mere-mortals/
copyright: 'Part of <a href="https://paulsullivan33-dev.github.io/mere-mortals/">For Mere Mortals</a> · Text <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>, code MIT'

# Guides live at the repo root (nice for GitHub browsing).
# The deploy workflow copies them into docs/ before building.
# The lab folder holds a sample MkDocs project of its own;
# keep it out of this site, it is a fixture, not a chapter.
exclude_docs: mkdocs-lab/*

theme:
  name: material

